# One-click deploy for Trading Journal (SPA + API + SQLite in one service).
# In Render: New → Blueprint → connect this repo → Apply.
# The Node server serves the built SPA and the REST API. SQLite and uploaded
# chart images live on a persistent disk so your journal survives redeploys.
services:
  - type: web
    name: trading-journal
    runtime: node
    plan: free
    branch: claude/trading-platform-mac-puadcu
    # Install dev deps too (vite/tsc/tsx live there) so the build can run.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: trading-journal-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Strong random session secret, generated once by Render and kept stable.
      - key: JWT_SECRET
        generateValue: true
      # DB + uploaded images live on the persistent disk.
      - key: DATA_DIR
        value: /var/data
      # Personal journal: registration closes after the first account.
      - key: OPEN_REGISTRATION
        value: "false"
