services:
  trading-journal:
    build: .
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_DIR: /var/data
      # CHANGE THIS in a real deployment (see .env.example), or omit it and the
      # server will generate and persist a secret next to the database.
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      OPEN_REGISTRATION: ${OPEN_REGISTRATION:-false}
    volumes:
      - journal-data:/var/data
    restart: unless-stopped

volumes:
  journal-data:
